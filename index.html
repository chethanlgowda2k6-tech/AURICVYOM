<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AuricVyom — Discover. Explore. Plan. Travel. | Luxury Indian Travel</title>
    
    <!-- Meta & SEO Best Practices -->
    <meta name="description" content="AuricVyom is India's premier luxury travel platform. Explore all 28 Indian state capitals, bespoke heritage sanctuaries, flights, hotels, curated tour packages, and AI travel companion." />
    <meta name="keywords" content="AuricVyom, Indian state capitals, Bengaluru, Jaipur, Mumbai, Hyderabad, luxury travel India, bespoke itinerary planner, flights, hotels, stays" />
    <meta name="author" content="AuricVyom Technologies" />

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="AuricVyom" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AuricVyom — Discover. Explore. Plan. Travel." />
    <meta property="og:description" content="Explore the capitals of all 28 Indian states with cinematic photography, curated stays, multi-modal transport, and bespoke itineraries." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1586861635167-e5223aadc9fe?auto=format&fit=crop&w=1200&q=80" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="./styles/main.css?v=2.5.2" />

    <style>
      /* Mobile Drawer Style */
      .mobile-drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(3, 5, 8, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 2999;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--transition-smooth);
      }
      .mobile-drawer-backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }
      .mobile-drawer {
        position: fixed;
        top: 0;
        right: -340px;
        width: min(320px, 85vw);
        height: 100vh;
        height: 100dvh;
        background: var(--bg-surface);
        border-left: 1.5px solid var(--border-gold);
        z-index: 3000;
        transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: -10px 0 40px rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .mobile-drawer.active {
        right: 0;
      }
      /* Print Styling */
      @media print {
        .auric-navbar, .auric-footer, .hero-cta-group, .floating-service-dock, .modal-close-btn, #add-trip-day-btn, #export-trip-voucher-btn, .ai-input-bar-wrap {
          display: none !important;
        }
        body, html {
          background: #ffffff !important;
          color: #000000 !important;
        }
        .modal-window-container, .destination-card, [style*="background: var(--bg-card)"] {
          background: #ffffff !important;
          color: #000000 !important;
          border: 1px solid #cccccc !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- App Root Mount -->
    <div id="app-root"></div>

    <!-- Application Script Entry Point -->
    <script type="module" src="./js/app.js?v=2.5.2"></script>
  </body>
</html>
